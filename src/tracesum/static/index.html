<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tracesum · 谁把主线程占了</title>
<style>
  :root { --ink: #14171f; --muted: #5b6472; --line: #d8dee9; --paper: #fbfaf7; --card: #ffffff; --accent: #2563eb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.65 ui-sans-serif, system-ui, "PingFang SC", "Noto Sans SC", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 3.5rem 1.25rem 4rem; }
  h1 { font-size: 1.6rem; letter-spacing: -.01em; margin: 0 0 .3rem; }
  .sub { color: var(--muted); margin: 0 0 2rem; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 2rem; }
  .chip { border: 1px solid var(--line); border-radius: 999px; background: var(--card);
          padding: .25rem .7rem; color: var(--muted); font-size: .9rem; }
  .chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
  h2 { font-size: 1rem; margin: 2rem 0 .6rem; }
  ol { margin: 0; padding-left: 1.2rem; }
  li { margin: .3rem 0; font-variant-numeric: tabular-nums; }
  li small { color: var(--muted); }
  .empty { color: var(--muted); }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: .9rem; }
  .snap { margin: 2.5rem 0 0; color: var(--muted); font-size: .82rem; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8eaf0; --muted: #9aa3b2; --line: #2b3240; --paper: #10131a; --card: #161b24; --accent: #7aa2ff; }
  }
</style>
</head>
<body>
<main>
  <h1>谁把主线程占了</h1>
  <p class="sub" id="sub"></p>
  <div class="chips" id="chips"></div>
  <h2 id="long-head">最长的任务</h2>
  <ol id="list"></ol>
  <p class="snap" id="snap"></p>
  <footer id="foot"></footer>
</main>
<script>
const chips = document.getElementById("chips");
const list = document.getElementById("list");
const foot = document.getElementById("foot");
const sub = document.getElementById("sub");

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}

function draw(data) {
  const named = data.main_name ? `（${data.main_name}）` : "";
  const snap = document.querySelector("#snap");
  if (snap && data.read_at) {
    const name = (data.source || "").split("/").pop();
    snap.textContent = `数据读于 ${data.read_at}${name ? "，来自 " + name : ""} · 重新导出 trace 后请重启 tracesum --serve`;
  }
  sub.textContent = data.main_guessed
    ? `${data.span_s}s 的 trace，最忙的线程是 ${data.main_tid}——这份 trace 没写线程名，主线程是猜的；忙 ${data.busy_ms}ms（${data.busy_share}%）`
    : `${data.span_s}s 的 trace，主线程 ${data.main_tid}${named} 忙 ${data.busy_ms}ms（${data.busy_share}%）`;
  chips.innerHTML = [
    `<span class="chip">script <b>${data.script_ms}</b>ms</span>`,
    // The terminal explains what "other" holds; a bare number on the page does not.
    ...(data.other_ms ? [`<span class="chip" title="定时器、事件派发、合成等四个分项没归类的 ${data.other_count} 个任务">other <b>${data.other_ms}</b>ms</span>`] : []),
    ...(data.overlap_ms ? [`<span class="chip" title="嵌套任务在每个名字下各算一次，所以分项之和会超过主线程忙时">分项重叠 <b>${data.overlap_ms}</b>ms</span>`] : []),
    `<span class="chip">style <b>${data.style_ms}</b>ms</span>`,
    `<span class="chip">layout <b>${data.layout_ms}</b>ms · <b>${data.layout_count}</b> 次</span>`,
    `<span class="chip">paint <b>${data.paint_ms}</b>ms</span>`,
    ...(data.threads || []).slice(0, 3).map((thread) =>
      `<span class="chip">${esc(thread.name || "tid " + thread.tid)} <b>${thread.busy_ms}</b>ms · ${thread.tasks} 个任务</span>`),
    ...(() => {
      const shown = Math.min(3, (data.threads || []).length);
      const total = data.thread_total || shown;
      return total > shown
        ? [`<span class="chip">另有 <b>${total - shown}</b> 个线程</span>`]
        : [];
    })(),
  ].join("");
  const longHead = document.getElementById("long-head");
  const offMain = (data.long_count || 0) - (data.main_long_count || 0);
  // The terminal has said "N of M shown" and "N not on the main thread" for a
  // while; the page still said only "最长的任务", so both numbers were invisible here.
  if (longHead) {
    // An empty list does not get a heading: "最长的任务（共 0）" over "没有超时任务"
    // reads like the second line contradicts the first.
    longHead.hidden = !(data.long_tasks && data.long_tasks.length);
    const shown = data.long_tasks ? data.long_tasks.length : 0;
    const total = data.long_count || 0;
    const counted = total > shown ? `显示前 ${shown} / 共 ${total}` : `共 ${total}`;
    const near = `≥${data.long_ms ?? 50}ms`;
    longHead.textContent = offMain
      ? `最长的任务（${near}，${counted}，${offMain} 个不在主线程）`
      : `最长的任务（${near}，${counted}）`;
  }
  if (!data.long_tasks || !data.long_tasks.length) {
    list.innerHTML = `<li class="empty">没有超过 ${data.long_ms ?? 50}ms 的任务——主线程没被长时间占住。</li>`;
  } else {
    list.innerHTML = data.long_tasks.map((task) =>
      `<li><b>${task.ms}</b>ms · @${task.start_s}s · ${esc(task.name)} <small>${esc(task.thread || "tid " + task.tid)}${task.nested ? "，在 " + esc(task.parent) + " 内" : ""}</small></li>`).join("");
  }
  foot.textContent = `来源 ${data.source} · 判据：主线程上 ≥${data.long_ms ?? 50}ms 的完整事件`;
}

fetch("/api/report", { cache: "no-store" })
  .then((response) => response.json())
  .then((data) => (data.error ? (sub.textContent = data.error) : draw(data)))
  .catch(() => { sub.textContent = "读不到 /api/report"; });
</script>
</body>
</html>
