[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tracesum"
version = "0.1.0"
description = "Read a Chrome performance trace on the command line: who was busy, and for how long"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
tracesum = "tracesum.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracesum = ["static/*.html"]
